<meta name="theme-color" content="#000">
<meta name="color-scheme" content="dark">
<meta name="description" content="nu studio est une société de production basée à Paris.">
<style>
/* Neue Haas Grotesk est une police sous licence. Ajoutez vos fichiers :
   @font-face { font-family: "Neue Haas Grotesk"; src: url("NeueHaasGrotesk-Roman.woff2") format("woff2"); font-weight: 400; }
   @font-face { font-family: "Neue Haas Grotesk"; src: url("NeueHaasGrotesk-Medium.woff2") format("woff2"); font-weight: 500; }
   En attendant, Helvetica Neue prend le relais. */
:root{
  --bg:#000; --fg:#fff; --mute:#8a8a8a; --line:#2a2a2a; color-scheme:dark;
  --font:"Neue Haas Grotesk Display","Neue Haas Grotesk Text","Neue Haas Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#fff;--mute:#777;--line:#222}}
:root[data-theme="dark"]{--bg:#000;--fg:#fff;--mute:#777;--line:#222}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.35;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
a{color:inherit;text-decoration:none}
header{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:9;background:transparent;color:#fff;mix-blend-mode:difference;display:flex;justify-content:space-between;align-items:baseline;padding:18px 24px}
.logo{font-weight:500;font-size:22px;letter-spacing:-.02em}
nav{display:flex;gap:28px}
nav a{color:var(--mute);transition:color .2s}
nav a:hover,nav a.on{color:var(--fg)}
main{padding:72px 24px 80px;min-height:70vh}
body.home main{padding:0;min-height:0}
.label{color:var(--mute);margin:36px 0 18px;display:flex;justify-content:space-between}
.list{list-style:none;border-top:1px solid var(--line)}
.list li{border-bottom:1px solid var(--line)}
.list a{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0;font-size:clamp(34px,7vw,104px);font-weight:500;letter-spacing:-.045em;line-height:1;transition:opacity .25s}
.list a small{font-size:13px;font-weight:400;letter-spacing:-.01em;color:var(--mute)}
@media (hover:hover){.list:hover a{opacity:.2}.list a:hover{opacity:1}}
#peek{position:fixed;left:0;top:0;height:220px;pointer-events:none;z-index:8;opacity:0;transition:opacity .2s}
#peek.on{opacity:1}
#peek img{height:100%;width:auto;display:block}
/* Page projet */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin:18px 0 20px}
.hero h1{font-size:clamp(36px,5.5vw,84px);font-weight:500;letter-spacing:-.05em;line-height:.95}
.back{color:var(--mute)}
.player{position:relative;margin:0 auto;background:#000;aspect-ratio:16/9;width:min(100%,max(420px,calc((100vh - 290px)*16/9)));width:min(100%,max(420px,calc((100svh - 290px)*16/9)))}
.player.v{aspect-ratio:9/16;width:min(100%,max(240px,calc((100vh - 290px)*9/16)));width:min(100%,max(240px,calc((100svh - 290px)*9/16)))}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
.player:fullscreen{width:100vw;height:100vh;max-width:none;aspect-ratio:auto;margin:0}
.player:-webkit-full-screen{width:100vw;height:100vh;max-width:none;aspect-ratio:auto;margin:0}
.shield{position:absolute;inset:0;z-index:1;background:transparent;border:0;display:block;width:100%}
.player,.player *{cursor:none!important}
html.intro #cur{display:none!important}
.pn{display:flex;justify-content:space-between;margin-top:20px;color:var(--mute)}
.pn a:hover{color:var(--fg)}
.about{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:28px}
.about h1 b{font-weight:700}
.about h1{font-size:clamp(28px,4.6vw,64px);font-weight:400;letter-spacing:-.04em;line-height:1.02;grid-column:1/-1;max-width:20ch}
.about div p+p{margin-top:1em}
.about a{border-bottom:1px solid var(--fg)}
footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px 24px;border-top:1px solid var(--line);color:var(--mute)}
footer a:hover{color:var(--fg)}
@media (max-width:700px){
  header,main,footer{padding-left:16px;padding-right:16px}
  nav{gap:16px}
  .about{grid-template-columns:1fr}
  .hero{flex-direction:column;align-items:flex-start}
  #peek{display:none}
}
/* Curseur personnalisé : carré arrondi → triangle « play » arrondi sur les liens */
@media (hover:hover) and (pointer:fine){
  html.cc,html.cc *{cursor:none!important}
  #cur{position:fixed;left:0;top:0;width:20px;height:20px;pointer-events:none;z-index:99999;opacity:0;transition:opacity .2s;will-change:transform}
  #cur.on{opacity:1}
  #cur svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transition:transform .3s cubic-bezier(.3,.7,.2,1),opacity .2s}
  #cur .tri{transform:scale(.3) rotate(-90deg);opacity:0}
  #cur.link .sq{transform:scale(.3) rotate(90deg);opacity:0}
  #cur.link .tri{transform:none;opacity:1}
}
/* Animation de lancement */
html.intro header,html.intro main,html.intro footer{opacity:0}
#intro{position:fixed;inset:0;z-index:99990;background:var(--bg);overflow:hidden;transition:opacity .45s}
#intro.out{opacity:0;pointer-events:none}
#intro .it{position:absolute;opacity:0;transform:scale(.94);transition:opacity .3s,transform .55s cubic-bezier(.2,.7,.2,1);overflow:hidden;background:#111}
#intro .it.on{opacity:1;transform:none}
#intro .it img{width:100%;height:100%;object-fit:cover;display:block}
#intro .it iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
.rv{opacity:0;transform:translateY(14px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i)*85ms)}
.rv.in{opacity:1;transform:none}
/* Landing : une vidéo plein écran par projet, titre par-dessus */
.slide{display:block;position:relative;height:100vh;height:100svh;overflow:hidden;background:#000 center/cover no-repeat}
.slide iframe{position:absolute;left:50%;top:50%;width:max(100vw,177.78vh);height:max(56.25vw,100vh);transform:translate(-50%,-50%);border:0;pointer-events:none;opacity:0;transition:opacity .9s}
.slide iframe.in{opacity:1}
.slide.v{background-size:contain}
.slide.v iframe{width:56.25vh;height:100%}
@media (max-aspect-ratio:1/1){.slide.v{background-size:cover}.slide.v iframe{width:max(100vw,56.25vh);height:max(177.78vw,100vh)}}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.6),rgba(0,0,0,0) 45%);pointer-events:none}
.slide .t{position:absolute;left:24px;right:24px;bottom:28px;z-index:2;font-size:clamp(44px,10vw,160px);font-weight:500;letter-spacing:-.05em;line-height:1.12;color:#fff}
.slide .t small{display:block;font-size:13px;font-weight:400;letter-spacing:-.01em;margin-bottom:14px;opacity:.75}
@media (max-width:700px){.slide .t{left:16px;right:16px;bottom:24px}}
.shield{cursor:none}
.ctl{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;flex-direction:column;gap:2px;padding:48px 16px 12px;color:#fff;background:linear-gradient(to top,rgba(0,0,0,.65),rgba(0,0,0,0));pointer-events:none;transition:opacity .4s}
.player.idle .ctl{opacity:0}
.tl{position:relative;height:24px;display:flex;align-items:center;pointer-events:auto;touch-action:none;-webkit-user-select:none;user-select:none}
.trk{position:relative;width:100%;height:3px;background:rgba(255,255,255,.3);transition:height .15s}
.tl:hover .trk,.tl.drag .trk{height:6px}
.trk i{position:absolute;left:0;top:0;bottom:0;width:0;background:#fff}
.trk b{position:absolute;left:0;top:50%;width:11px;height:11px;border-radius:3px;background:#fff;transform:translate(-50%,-50%)}
.tip{position:absolute;bottom:22px;transform:translateX(-50%);font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.tl:hover .tip,.tl.drag .tip{opacity:1}
.row{display:flex;gap:22px;align-items:center;pointer-events:none}
.row button{pointer-events:auto;background:none;border:0;color:#fff;font:inherit;letter-spacing:-.01em;padding:4px 0}
.row #tm{opacity:.7;font-variant-numeric:tabular-nums}
.row #bf{margin-left:auto}
</style>
<script>(function(){try{var h=location.hash.replace(/^#\/?/,'');if(!h&&!matchMedia('(prefers-reduced-motion:reduce)').matches){document.documentElement.classList.add('intro');setTimeout(function(){document.documentElement.classList.remove('intro')},12000)}}catch(e){}})();</script>
</head>

   '<div class="ctl"><div class="tl" id="tl"><div class="trk"><i id="fill"></i><b id="knob"></b></div><span class="tip" id="tip"></span></div>'+
   '<div class="row"><button id="bp" type="button">Pause</button><span id="tm">0:00 / 0:00</span><button id="bs" type="button">Son activé</button><button id="bf" type="button">Plein écran</button></div></div></div>'+
   '<div class="pn"><a href="#/projet/'+pr.s+'">← '+esc(pr.n)+'</a><a href="#/projet/'+nx.s+'">'+esc(nx.n)+' →</a></div>';
  var $=function(x){return document.getElementById(x)},fr=$("vf"),pl=$("pl"),bp=$("bp"),bs=$("bs"),bf=$("bf"),sh=$("sh"),tl=$("tl"),fill=$("fill"),knob=$("knob"),tip=$("tip"),tm=$("tm");
  var m0=/^(\d+):(\d+)/.exec(p.d||"");
  var playing=true,sound=true,dur=m0?(+m0[1])*60+(+m0[2]):0,cur=0,drag=false,lastSeek=0,idleT=null;
  function cmd(m,v){try{fr.contentWindow.postMessage(JSON.stringify(v===undefined?{method:m}:{method:m,value:v}),"*")}catch(e){}}
  function fmt(x){x=Math.max(0,x||0);return Math.floor(x/60)+":"+("0"+Math.floor(x%60)).slice(-2)}
  function fmtT(x){x=Math.max(0,x||0);return Math.floor(x/60)+":"+("0"+(x%60).toFixed(1)).slice(-4)}
  function paint(x){cur=x;var pc=dur?Math.min(1,x/dur)*100:0;fill.style.width=pc+"%";knob.style.left=pc+"%";tm.textContent=fmt(x)+" / "+fmt(dur)}
  function wake(){pl.classList.remove("idle");clearTimeout(idleT);if(playing) idleT=setTimeout(function(){pl.classList.add("idle")},1000)}
  ["mousemove","pointerdown","touchstart"].forEach(function(n){pl.addEventListener(n,wake,{passive:true})});
  function ui(){
    bp.textContent=playing?"Pause":"Lecture";bs.textContent=sound?"Son activé":"Son coupé";
    if(playing) wake(); else {pl.classList.remove("idle");clearTimeout(idleT)}
  }
  function toggle(){playing=!playing;cmd(playing?"play":"pause");if(playing&&sound)cmd("setVolume",1);ui()}
  sh.addEventListener("mousedown",function(e){e.preventDefault()});
  sh.onclick=toggle; bp.onclick=toggle;
  sh.addEventListener("keydown",function(e){if(e.key===" "||e.key==="Enter"){e.preventDefault();toggle()}});
  bs.onclick=function(){sound=!sound;cmd("setVolume",sound?1:0);ui()};
  bf.onclick=function(){
    if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
    else{(pl.requestFullscreen||pl.webkitRequestFullscreen).call(pl)}
  };
  // Barre de temps : clic ou glisser pour choisir le moment (précision au dixième de seconde)
  function ratio(e){var b=tl.getBoundingClientRect();return Math.min(1,Math.max(0,(e.clientX-b.left)/b.width))}
  function seek(e,force){
    if(!dur) return; var x=Math.round(ratio(e)*dur*10)/10; paint(x);
    var n=Date.now(); if(force||n-lastSeek>70){lastSeek=n;cmd("setCurrentTime",x)}
  }
  tl.addEventListener("pointerdown",function(e){drag=true;tl.classList.add("drag");try{tl.setPointerCapture(e.pointerId)}catch(x){} seek(e,true)});
  tl.addEventListener("pointermove",function(e){if(!dur) return;var r=ratio(e);tip.textContent=fmtT(r*dur);tip.style.left=(r*100)+"%";if(drag) seek(e)});
  tl.addEventListener("pointerup",function(e){if(drag) seek(e,true);drag=false;tl.classList.remove("drag")});
  tl.addEventListener("pointercancel",function(){drag=false;tl.classList.remove("drag")});
  function listen(){["play","pause","timeupdate"].forEach(function(n){cmd("addEventListener",n)});cmd("getDuration")}
  pmsg=function(e){
    if(e.source!==fr.contentWindow) return;
    var d=e.data; if(typeof d==="string"){try{d=JSON.parse(d)}catch(x){return}} if(!d) return;
    if(d.event==="ready"){listen();cmd("setVolume",1)}
    else if(d.method==="getDuration"&&d.value){dur=d.value;paint(cur)}
    else if(d.event==="play"){playing=true;ui()}
    else if(d.event==="pause"){playing=false;ui()}
    else if(d.event==="timeupdate"&&d.data){dur=d.data.duration||dur;if(!drag) paint(d.data.seconds)}
  };
  window.addEventListener("message",pmsg);
  fr.addEventListener("load",function(){listen();cmd("setVolume",1);setTimeout(function(){cmd("setVolume",1);cmd("play")},600)});
  paint(0); ui();
}

function route(){
  var p=location.hash.replace(/^#\/?/,'').split('/');
  peek.classList.remove('on');
  if(io){io.disconnect();io=null}
  var isHome=!(p[0]==='projet'||p[0]==='about'); document.body.classList.toggle('home',isHome);
  if(p[0]==='projet') project(decodeURIComponent(p[1]||'')); else if(p[0]==='about') about(); else home();
  document.querySelectorAll('nav a').forEach(function(a){a.classList.toggle('on',a.dataset.r===(p[0]==='about'?'about':'home'))});
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
document.addEventListener('mousemove',function(e){
  var a=e.target.closest&&e.target.closest('.list a');

// Animation de lancement : vignettes vidéo qui apparaissent une à une, puis texte en fondu progressif
(function(){
  var de=document.documentElement; if(!de.classList.contains("intro")) return;
  var done=false,timers=[];
  function T(f,ms){timers.push(setTimeout(f,ms))}
  var ov=document.createElement("div"); ov.id="intro"; document.body.appendChild(ov);
  var W=innerWidth,H=innerHeight,narrow=W<700,base=Math.min(W,H)*(narrow?.5:.36);
  var cols=narrow?2:4,rows=narrow?4:2,N=Math.min(cols*rows,PROJ.length),cells=[],i,j,t;
  for(i=0;i<N;i++)cells.push(i);
  for(i=N-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=cells[i];cells[i]=cells[j];cells[j]=t}
  var tiles=cells.map(function(c,k){
    var p=PROJ[k%PROJ.length],v=p.o==="v";
    var w=v?base*.58*(.8+Math.random()*.5):base*(1+Math.random()*.6),h=v?w*16/9:w*9/16;
    var cw=W/cols,ch=H/rows;
    if(w>cw*.92){w=cw*.92;h=v?w*16/9:w*9/16}
    if(h>ch*.92){h=ch*.92;w=v?h*9/16:h*16/9}
    var x=(c%cols)*cw+Math.max(0,(cw-w)*Math.random()),y=Math.floor(c/cols)*ch+Math.max(0,(ch-h)*Math.random());
    var d=document.createElement("div"); d.className="it";
    d.style.cssText="left:"+x+"px;top:"+y+"px;width:"+w+"px;height:"+h+"px";
    if(p.p){var im=new Image(); im.src=p.p; d.appendChild(im)}else{var fr=document.createElement("iframe"); fr.setAttribute("allow","autoplay"); fr.tabIndex=-1; fr.src="https://player.vimeo.com/video/"+p.vm+"?"+(p.h?"h="+p.h+"&":"")+"background=1&autoplay=1&loop=1&muted=1&dnt=1"; d.appendChild(fr)}
    ov.appendChild(d); return d;
  });
  function reveal(){
    var els=[].slice.call(document.querySelectorAll(".logo,header nav a,.slide .t,footer span"));
    els.forEach(function(e,k){e.classList.add("rv");e.style.setProperty("--i",k)});
    de.classList.remove("intro"); void document.body.offsetWidth;
    requestAnimationFrame(function(){els.forEach(function(e){e.classList.add("in")})});
    setTimeout(function(){els.forEach(function(e){e.classList.remove("rv","in");e.style.removeProperty("--i")})},els.length*85+1200);
  }
  function finish(){
    if(done) return; done=true; timers.forEach(clearTimeout);
    ov.classList.add("out"); reveal(); setTimeout(function(){ov.remove()},600);
  }
  ov.addEventListener("click",finish);
  var step=280,start=400;
  tiles.forEach(function(d,k){T(function(){d.classList.add("on")},start+k*step)});
  var tEnd=start+N*step+500;
  tiles.forEach(function(d,k){T(function(){d.classList.remove("on")},tEnd+k*120)});
  T(finish,tEnd+N*120+350);
})();
